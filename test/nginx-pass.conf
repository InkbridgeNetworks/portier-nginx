# Second service provider, in sp.anonymous = "pass" mode, on 127.0.0.1:18090.
# Reads test/pass/portier/conf.lua ahead of test/portier/conf.lua.
worker_processes 1;
error_log /dev/stderr info;
pid /tmp/nginx-pass-test.pid;
events { worker_connections 64; }
http {
	lua_package_path '/work/src/?.lua;/work/test/pass/?.lua;/work/test/?.lua;;';
	access_log off;
	client_body_temp_path /tmp/nginx-pass-body;
	proxy_temp_path /tmp/nginx-pass-proxy;
	fastcgi_temp_path /tmp/nginx-pass-fcgi;
	uwsgi_temp_path /tmp/nginx-pass-uwsgi;
	scgi_temp_path /tmp/nginx-pass-scgi;
	init_by_lua_block { require "portier.sp.init" }
	include /work/etc/nginx/portier-sp-http.conf;

	server {
		listen 127.0.0.1:18090;
		location /protected {
			set $portier_nginx_uid "";
			set $portier_nginx_email "";
			access_by_lua_block { require("portier.sp.access").run() }
			content_by_lua_block {
				ngx.say("uid=", ngx.var.portier_nginx_uid)
				ngx.say("cookie=", ngx.var.http_cookie or "")
			}
		}
	}
}
