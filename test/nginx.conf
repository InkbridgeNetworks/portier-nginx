# Test vhosts. Not for deployment.
#
#   127.0.0.1:18080  service provider: /mint (test-only) and /protected
#   127.0.0.1:18081  broker stub: discovery, key set, id_token mint
#   127.0.0.1:18082  identity provider, from the rock's snippets
#
# The directory is stubbed through package.preload so the identity provider
# runs without an LDAP server; the fixtures are in test/directory_stub.lua.
worker_processes 1;
error_log /dev/stderr info;
pid /tmp/nginx-test.pid;
events { worker_connections 64; }
http {
	lua_package_path '/work/src/?.lua;/work/test/?.lua;;';
	access_log off;
	client_body_temp_path /tmp/nginx-body;
	proxy_temp_path /tmp/nginx-proxy;
	fastcgi_temp_path /tmp/nginx-fcgi;
	uwsgi_temp_path /tmp/nginx-uwsgi;
	scgi_temp_path /tmp/nginx-scgi;

	init_by_lua_block {
		package.preload["portier.idp.directory"] = function()
			return require "directory_stub"
		end
		broker_stub = require "broker_stub"
		require "portier.sp.init"
		require "portier.idp.init"
	}
	include /work/etc/nginx/portier-sp-http.conf;
	include /work/etc/nginx/portier-idp-http.conf;

	# Service provider.
	server {
		listen 127.0.0.1:18080;

		# Test-only mint. ?grants=a|b&groups=x|y&iss=... Lists split on "|" because a DN carries commas.
		location = /mint {
			content_by_lua_block {
				local token = require "portier.token"
				local idp = require "portier.idp.init"
				local args = ngx.req.get_uri_args()
				local function list(s)
					local t = {}
					if s and s ~= "" then
						for v in string.gmatch(s, "[^|]+") do t[#t + 1] = v end
					end
					return t
				end
				local claims = {
					sub = "user@example.org", uid = args.uid or "user",
					groups = list(args.groups), grants = list(args.grants),
					support_tier = "Gold",
				}
				local tok = assert(token.mint(claims, idp.key, args.iss or "http://127.0.0.1:18082"))
				ngx.say(tok)
			}
		}

		location /protected {
			set $portier_nginx_uid "";
			set $portier_nginx_email "";
			access_by_lua_block { require("portier.sp.access").run() }
			content_by_lua_block {
				ngx.say("uid=", ngx.var.portier_nginx_uid)
				ngx.say("email=", ngx.var.portier_nginx_email)
				ngx.say("cookie=", ngx.var.http_cookie or "")
			}
		}
	}

	# Broker stub.
	server {
		listen 127.0.0.1:18081;
		location = /.well-known/openid-configuration {
			content_by_lua_block { broker_stub.openid_configuration() }
		}
		location = /keys.json {
			content_by_lua_block { broker_stub.keys() }
		}
		# ?sub=&nonce=&aud=&alg=&iss=  mints an id_token
		location = /id_token {
			content_by_lua_block { broker_stub.id_token() }
		}
	}

	# Identity provider. The spec logs in far more than 5 times a minute, so
	# the login rate limit only logs here.
	server {
		listen 127.0.0.1:18082;
		limit_req_dry_run on;
		include /work/etc/nginx/portier-idp.conf;
	}
}
