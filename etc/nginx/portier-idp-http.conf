# portier identity provider, http context.
#
# Include from the http block of the IdP vhost's nginx.conf. The rock's Lua
# must be on lua_package_path (luarocks puts it there on a rock install) and
# the deployment's portier/conf.lua must be reachable as the module
# portier.conf, for example by adding its directory to lua_package_path:
#
#     lua_package_path '/etc/portier/?.lua;;';
#
# Load the identity provider state at startup so a bad key or config stops
# nginx rather than the first login. nginx allows one init_by_lua_block per
# http block, so the snippet leaves it to the vhost's nginx.conf:
#
#     init_by_lua_block { require "portier.idp.init" }

# Login attempts per client address, enforced on the login location.
limit_req_zone $binary_remote_addr zone=portier_login:10m rate=5r/m;

# Cache for the broker's discovery document and key set, served through the
# internal proxy location.
proxy_cache_path /var/cache/nginx/portier keys_zone=portier_broker:64k;
