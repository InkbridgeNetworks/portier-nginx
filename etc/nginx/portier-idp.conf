# portier identity provider, server context.
#
# Include from the server block that answers on the IdP origin. The origin is
# what the browser sees: `iss` of the minted tokens, the broker client_id, and
# the redirect_uri the broker posts back to, so this server block must sit
# behind TLS at the public hostname.

limit_req_status 429;

location = /.portier/login {
	limit_req zone=portier_login burst=5 nodelay;

	limit_except HEAD GET {
		deny all;
	}

	access_by_lua_block {
		require("portier.idp.login").run()
	}

	# The login page, one file. luarocks installs the rock's copy under
	# <rocks_dir>/portier-idp/<version>/conf/webroot; a deployment may point
	# this at its own branded page.
	alias /etc/portier/webroot/index.html;
}

location = /.portier/verify {
	limit_except POST {
		deny all;
	}

	access_by_lua_block {
		require("portier.idp.verify").run()
	}
}

location = /.portier/logout {
	limit_except HEAD GET {
		deny all;
	}

	content_by_lua_block {
		require("portier.idp.logout").run()
	}
}

location = /.portier/jwks.json {
	limit_except HEAD GET {
		deny all;
	}

	content_by_lua_block {
		require("portier.idp.jwks").run()
	}
}

# Internal fetch of the broker's discovery document and key set, with a
# cache in front. portier.idp.init.proxy_url builds the path.
location ~ ^/.portier/proxy/(?<proxy_scheme>[^/]+)/(?<proxy_host>[^/]+)(?<proxy_url>.*)$ {
	internal;

	resolver 1.1.1.1 1.0.0.1;

	proxy_http_version 1.1;
	proxy_pass_request_headers off;
	proxy_pass_request_body off;

	proxy_set_header Accept "application/json";

	# A variable, so the DNS lookup happens at request time through
	# `resolver` rather than once at startup.
	set $proxy_backend "$proxy_scheme://$proxy_host$proxy_url$is_args$args";
	proxy_pass $proxy_backend;

	proxy_ssl_verify on;
	proxy_ssl_verify_depth 10;
	proxy_ssl_server_name on;
	proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

	proxy_cache_lock on;
	proxy_cache_use_stale error timeout updating;
	proxy_cache portier_broker;
}
