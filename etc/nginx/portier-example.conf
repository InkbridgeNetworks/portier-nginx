# Complete sample: one nginx serving both the identity provider and a
# protected application. A real deployment runs the identity provider on its
# own host and includes only the service provider snippets on application
# hosts. Both hosts read portier/conf.lua from a directory on
# lua_package_path; see src/portier/config.lua for every key.

http {
	lua_package_path '/etc/portier/?.lua;;';

	init_by_lua_block {
		require "portier.sp.init"
		require "portier.idp.init"
	}

	include portier-sp-http.conf;
	include portier-idp-http.conf;

	# Identity provider: the origin the browser logs in at. Must be the
	# host that idp.public_origin names, or the host the request arrives on
	# when public_origin is unset.
	server {
		listen 443 ssl;
		server_name portier.example.org;

		include portier-idp.conf;
	}

	# Service provider: a protected application. Its policy, audience and
	# the identity provider's JWKS URL come from the sp half of conf.lua.
	server {
		listen 443 ssl;
		server_name rt.example.org;

		location / {
			set $portier_nginx_uid "";
			set $portier_nginx_email "";

			access_by_lua_block {
				require("portier.sp.access").run()
			}

			include fastcgi_params;
			fastcgi_param REMOTE_USER $portier_nginx_uid;
			fastcgi_pass unix:/var/run/fcgi.sock;
		}
	}
}
