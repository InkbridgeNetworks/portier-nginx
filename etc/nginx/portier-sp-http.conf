# portier service provider, http context.
#
# Include from the http block of a service provider vhost's nginx.conf. The
# deployment's portier/conf.lua must be reachable as the module portier.conf.
# The protected location then runs the access phase:
#
#     location / {
#         set $portier_nginx_uid "";
#         set $portier_nginx_email "";
#         access_by_lua_block { require("portier.sp.access").run() }
#         fastcgi_param REMOTE_USER $portier_nginx_uid;
#         ...
#     }
#
# Load the service provider state at startup so a bad config stops nginx
# rather than the first request. nginx allows one init_by_lua_block per http
# block, so the snippet leaves it to the vhost's nginx.conf:
#
#     init_by_lua_block { require "portier.sp.init" }

# Cache for the identity provider's key set and the PEM resolved per kid.
lua_shared_dict portier_jwks 1m;
